# PAPER STUDY ONLY (2026-10-05): deployed configs/yolo_ism_objects.yaml + gate study (semantic 0.25, HSV 0.06,
# ownership fallback; tuned on YCB-V held-out frames). Not the deployed config.
defaults:
  weights: yolov8m-worldv2.pt
  device: cuda:0
  top_k: 3
  score_threshold: 0.02
  hsv_gate_enabled: true
  hsv_gate_shadow_mode: false
  hsv_gate_threshold: 0.06
  hsv_hue_shift_deg: -6
  hsv_sat_gain: 1.3
  hsv_hist_bins:
  - 16
  - 8
  hsv_lowsat_exception: false
  hsv_hue_correction_ocv: 0
  training_free_gate_enabled: false
  training_free_gate_method: phase1c
  appe_v2_enabled: true
  appe_v2_blocks:
  - 2
  - 9
  appe_v2_gate: 0.605
  cross_object_nms_enabled: true
  cross_object_nms_iou: 0.9
  yolo_multi_label: true
  relative_assignment_enabled: true
  color_tiebreak_template_sim: 0.6
  imgsz: 640
  similarity_threshold: 0.25
  use_mask: true
  appe_gate: 0.55
  appe_blocks:
  - 11
  nms_rank_blocks:
  - 2
  - 9
  match_topk: 5
  seg_weights: mobile_sam.pt
  stride: 10
  assignment_fallback: true
objects:
- name: milk
  yolo_prompt: milk carton
  object_id: Milk_high
  template_dir: template/milk_high/templates
  cad_ply: data/cad/milk_high/Milk_high.ply
  enabled: true
- name: choco_hazelnut_high
  yolo_prompt: maroon box
  object_id: choco_hazelnut_color_high
  template_dir: template/choco_hazelnut_color_high/templates
  cad_ply: data/cad/choco_hazelnut_color_high/choco_hazelnut_color_with_normal_vertexcolor.ply
  enabled: true
- name: choco_hazelnut_low
  yolo_prompt: brown box
  object_id: choco_hazelnut_color_low
  template_dir: template/choco_hazelnut_color_low/templates
  cad_ply: data/cad/choco_hazelnut_color_low/choco_hazelnut_color_with_normal_vertexcolor.ply
  enabled: false
- name: Febreze_high
