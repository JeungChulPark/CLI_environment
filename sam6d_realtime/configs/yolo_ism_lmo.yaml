# yolo_ism_lmo.yaml — BOP lmo (8 objects), generated by objpose/tools/make_bop_ism_config.py
#
# Same recogniser operating point as configs/yolo_ism_objects.yaml, with the HSV colour gate
# OFF: its threshold (0.1214) was fitted on the lab objects and nothing has been fitted on
# this dataset. Templates are the 42-view CPU renders of its obj_*.ply
# (objpose/tools/render_bop_templates.sh); PEM assets come from
# objpose/tools/build_bop_assets.py.
#
# Per-dataset overrides from the table (rt/bop/lmo_objects.json):
#   relative_assignment_enabled: False
defaults:
  weights: yolov8m-worldv2.pt
  device: cuda:0
  top_k: 3
  score_threshold: 0.02
  hsv_gate_enabled: false
  hsv_gate_shadow_mode: false
  hsv_gate_threshold: 0.1214
  hsv_hue_shift_deg: -6
  hsv_sat_gain: 1.3
  hsv_hist_bins:
  - 16
  - 8
  hsv_lowsat_exception: false
  hsv_hue_correction_ocv: 0
  training_free_gate_enabled: false
  training_free_gate_method: phase1c
  appe_v2_enabled: true
  appe_v2_blocks:
  - 2
  - 9
  appe_v2_gate: 0.605
  cross_object_nms_enabled: true
  cross_object_nms_iou: 0.9
  yolo_multi_label: true
  relative_assignment_enabled: false
  color_tiebreak_template_sim: 0.6
  imgsz: 640
  similarity_threshold: 0.35
  use_mask: true
  appe_gate: 0.55
  appe_blocks:
  - 11
  nms_rank_blocks:
  - 2
  - 9
  match_topk: 5
  seg_weights: mobile_sam.pt
  stride: 10
objects:
- name: lmo_ape
  yolo_prompt: dark red figurine
  object_id: lmo_ape
  template_dir: template/lmo_ape/templates
  cad_ply: /home/jucpark/DeepLearning/Datasets/paper_benchmarks/bop/lmo/models/obj_000001.ply
  enabled: true
- name: lmo_can
