# 260826 260826_etri_eightcircle_dark — 수신/추론 분리판(sam6d_split.launch.py) bag 자동 재생 설정 (run_bagplay_260826_different.yaml 기반)
#   변환본: /home/jucpark/DeepLearning/Datasets/data_slam_converted/260826_etri_eightcircle_dark/SAM
#   conda activate sam6d && export ROS_DOMAIN_ID=72
#   ros2 launch realtime/launch/sam6d_split.launch.py config:=realtime/run_split_260826_eightcircle_dark.yaml

topics:
  rgb: /camera/camera/color/image_raw
  depth: /camera/camera/aligned_depth_to_color/image_raw
  caminfo: /camera/camera/color/camera_info

ism:
  config: configs/yolo_ism_objects.yaml
  objects: []                 # 비우면 config 의 활성 객체 전부(9개)

runtime:
  device: cuda:0
  use_sim_time: true          # bag 을 --clock 으로 재생하므로 true
  sync_slop: 0.02
  sync_queue: 30
  qos_reliability: reliable   # best_effort 면 대량 유실 (NOTES 24절)
  qos_depth: 30
  det_score_thresh: 0.2
  status_period_s: 1.0
  idle_exit_s: 30             # 첫 프레임 뒤 입력이 끊기면 추론이 스스로 종료
  # sam6d_master 동기화(2026-08-29)로 verify 기본값(독립 검증 ON) 복원

output:
  dir: output/split_260826_eightcircle_dark_webcheck
  diagnostics: true

bag:
  play: true                  # READY 게이트 뒤 launch 가 직접 재생
  path: /home/jucpark/DeepLearning/Datasets/data_slam_converted/260826_etri_eightcircle_dark/SAM
  rate: 1.0
  clock: true
  ready_timeout: 600
