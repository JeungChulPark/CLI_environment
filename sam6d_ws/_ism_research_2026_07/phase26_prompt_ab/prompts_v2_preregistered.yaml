# 프롬프트 재설계 v2 — **평가 전 사전 등록** (2026-07-23)
#
# 원칙
#  1. 혼동 쌍에서 갈리는 **판별 특징**(색·재질·특징 부위)을 넣는다.
#  2. 여러 클래스가 공유하는 상위 범주어("doll", "box", "bottle" 단독)를 줄인다.
#     — 확정 데이터상 'doll' 이 인형 3종을, 'box' 가 초코↔택배박스를 묶고 있다.
#  3. 짧은 명사구 유지(YOLO-World 는 장문에 약함).
#  4. 이 파일은 평가 **이전에** 고정한다. 결과를 보고 프롬프트를 고치지 않는다.
#     (고치면 사람이 하는 과적합 = GT-fit 이 되어 INV 위반)
#
# 근거: 사람 확정 GT(275건 후보판정 + 144건 혼동 메모)
#   Sauce ← Sikhye 24 · Dinosaur ← Bear 18 · choco ← 택배박스 17
#   Rabbit ← Dinosaur 10 · Mugcup ← Sikhye 9 · milk ← 택배박스 5

