    template_dir: template/Mugcup_color_high/templates
    cad_ply: data/cad/Mugcup_color_high/Mugcup_color_with_normal_vertexcolor.ply
    enabled: true

  - name: Mugcup_low
    yolo_prompt: "mug cup"
