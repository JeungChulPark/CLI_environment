# Multi-object YOLO-World + SAM-6D ISM recognition config.
# Consumed by yolo_ism_object_n.py (reuses yolo_ism.py functions, no source edits).
#
# `defaults` = global operating point (milk ISM operating point).
# `objects[]` = per-object recognition target. Each object may override any
#   default key (e.g. similarity_threshold, appe_gate, top_k, yolo_prompt).
# PEM / 6D pose / geometric(depth) axes are OUT OF SCOPE here.

defaults:
  weights: yolov8m-worldv2.pt          # YOLO-World checkpoint (falls back to s)
  device: cuda:0
  top_k: 3                             # max YOLO proposals kept per object/frame
  score_threshold: 0.02                # YOLO-World confidence threshold
  similarity_threshold: 0.35           # semantic(cls) 1st gate
  use_mask: true                       # MobileSAM masked-appe 2nd gate
  appe_gate: 0.55                      # masked-appe 2nd-gate threshold
  match_topk: 5                        # top-k template avg for semantic/appe
  seg_weights: mobile_sam.pt           # MobileSAM weights for proposal masking
  stride: 10                           # process every Nth frame
  # dinov2_checkpoint: <auto>          # default = yolo_ism.DEFAULT_DINOV2_CKPT
  # cls_cache / appe_cache auto-derived per object if omitted:
  #   outputs/yolo_ism_object_n/template_features/<name>_{cls,appe}.pt

objects:
  - name: milk
    yolo_prompt: "milk carton"
    object_id: Milk_scaled_195mm
    # validated milk templates (template/milk/templates gives ~0.22 sem vs ~0.52 here)
    template_dir: sam6d_master/SAM-6D/Data/custom/Milk_scaled_195mm/templates
    cad_ply: data/cad/fail/milk/Milk.ply      # valid 195mm CAD (folder moved to fail/, but used by PEM)
    enabled: true

  - name: choco_hazelnut_high
    yolo_prompt: "brown box"                   # color+shape: sweep winner (brown box >> carton on weak bags, milk preserved, longer phrases→0)
    object_id: choco_hazelnut_color_high
    template_dir: template/choco_hazelnut_color_high/templates
    cad_ply: data/cad/choco_hazelnut_color_high/choco_hazelnut_color_with_normal_vertexcolor.ply
    enabled: true

  - name: choco_hazelnut_low
    yolo_prompt: "brown box"
    object_id: choco_hazelnut_color_low
    template_dir: template/choco_hazelnut_color_low/templates
    cad_ply: data/cad/choco_hazelnut_color_low/choco_hazelnut_color_with_normal_vertexcolor.ply
    enabled: false  # low-texture template moved to fail/

  - name: Febreze_high
    yolo_prompt: "febreze spray bottle"
    object_id: Febreze_high
    template_dir: template/Febreze_high/templates
    cad_ply: data/cad/Febreze_high/Febreze_color_with_normal_vertexcolor.ply
    enabled: true

  - name: Febreze_low
