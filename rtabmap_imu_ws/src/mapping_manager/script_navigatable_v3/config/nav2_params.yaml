bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Check the current path against the dynamic global costmap at 2 Hz and
    # recompute immediately when an observed obstacle invalidates the path.
    # navigation.launch.py rewrites this to the local precision tree, which
    # removes the impossible/unsafe reverse recovery while preserving 2 Hz
    # path validity checking.
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/nav_to_pose_with_consistent_replanning_and_if_path_becomes_invalid.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Keep terminal 5 cm corrections from being classified as "no progress".
      required_movement_radius: 0.05
      movement_time_allowance: 20.0

    goal_checker:
      # A stateful SimpleGoalChecker latched XY as soon as the robot entered
      # the old 18 cm radius, then ignored skid-steer translation during the
      # final rotation. Require the full pose and stopped odometry together.
      plugin: "nav2_controller::StoppedGoalChecker"
      stateful: false
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.08
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.03

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.60
      angular_disengage_threshold: 0.20
      forward_sampling_distance: 0.50
      rotate_to_heading_angular_vel: 0.65
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      # Let MPPI correct position and heading together. The shim's internal
      # stateful position checker can otherwise ignore Husky slip while doing
      # a pure final rotation.
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      closed_loop: true
      use_path_orientations: false
      primary_controller: "nav2_mppi_controller::MPPIController"

      time_steps: 56
      model_dt: 0.05
      # Keep MPPI within the 20 Hz control deadline on the onboard computer.
      batch_size: 1200
      iteration_count: 1
      motion_model: "DiffDrive"
      vx_max: 0.45
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.9
      ax_max: 0.8
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.5
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.28
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Keep the measured bumper-inclusive A200 footprint. Only the external
      # padding is reduced for the indoor preset; do not shrink this polygon
      # unless the physical robot is measured again.
      footprint: "[[0.55, 0.36], [0.55, -0.36], [-0.55, -0.36], [-0.55, 0.36]]"
      footprint_padding: 0.015
      # StaticLayer protects mapped walls/shelves even inside the VLP-16 close
      # blind zone. VoxelLayer adds newly observed static or moving obstacles.
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: -0.10
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_threshold: 0
        # VLP-16 is the authoritative navigation obstacle source. Use the
        # complete 16-ring cloud rather than the single-ring /scan projection.
        observation_sources: "lidar_points depth_points"
        lidar_points:
          topic: /velodyne_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # Reject the lowest-ring floor return near the 3 m cutoff.
          min_obstacle_height: 0.08
          max_obstacle_height: 1.5
          obstacle_min_range: 0.85
          obstacle_max_range: 3.0
          raytrace_min_range: 0.85
          raytrace_max_range: 3.0
          observation_persistence: 0.0
          # Unit is seconds. The compact unorganized VLP-16 cloud is normally
          # close to 10 Hz; retain margin for a transient packet/CPU delay.
          expected_update_rate: 1.0
        depth_points:
          topic: /camera/depth_cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.08
          max_obstacle_height: 1.5
          obstacle_min_range: 0.30
          obstacle_max_range: 3.0
          raytrace_min_range: 0.30
          raytrace_max_range: 3.5
          observation_persistence: 0.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The padded footprint circumscribed radius is about 0.678 m. Nav2
        # requires inflation_radius >= this value for efficient SE2 footprint
        # collision checks. A steeper scaling factor makes the useful cost
        # band decay quickly, while retaining a nonzero cost at the 0.678 m
        # footprint corner so MPPI can use its optimized collision check.
        inflation_radius: 0.69
        cost_scaling_factor: 15.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.55, 0.36], [0.55, -0.36], [-0.55, -0.36], [-0.55, 0.36]]"
      footprint_padding: 0.015
      plugins: ["static_layer", "dynamic_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      dynamic_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: "lidar_points depth_points"
        lidar_points:
          topic: /velodyne_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.08
          max_obstacle_height: 1.5
          obstacle_min_range: 0.85
          obstacle_max_range: 3.0
          raytrace_min_range: 0.85
          raytrace_max_range: 3.0
          observation_persistence: 0.0
          expected_update_rate: 1.0
        depth_points:
          topic: /camera/depth_cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.08
          max_obstacle_height: 1.5
          obstacle_min_range: 0.30
          obstacle_max_range: 3.0
          raytrace_min_range: 0.30
          raytrace_max_range: 3.5
          observation_persistence: 0.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Match the local costmap so invalid paths are detected consistently.
        inflation_radius: 0.69
        cost_scaling_factor: 15.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Exact-coordinate semantics: fail if the requested cell is occupied
      # instead of silently substituting a point up to 30 cm away.
      tolerance: 0.0
      use_astar: true
      # Do not use unmapped/unknown cells as a shortcut around mapped shelves.
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.65
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: "CLOSED_LOOP"
    scale_velocities: false
    max_velocity: [0.45, 0.0, 0.9]
    min_velocity: [0.0, 0.0, -0.9]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    polygons: ["FootprintApproach", "ForwardStop"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: /local_costmap/published_footprint
      # At vx_max=0.45 m/s this still provides about 0.54 m of prediction,
      # while avoiding excessive slowdown along parallel aisle walls.
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 4
      visualize: true
      enabled: true
    ForwardStop:
      type: "polygon"
      # Half-width 0.375 m matches the 0.36 m footprint plus 0.015 m padding.
      points: "[[1.05, 0.375], [1.05, -0.375], [0.35, -0.375], [0.35, 0.375]]"
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: forward_stop_polygon
      enabled: true
    # VLP-16 provides 360-degree coverage from 0.9 m; the D455 depth cloud
    # covers the close front blind zone from 0.3 m.
    observation_sources: ["lidar_points", "depth_points"]
    lidar_points:
      type: "pointcloud"
      topic: /velodyne_points
      # Height is checked after transforming the cloud into base_link.
      min_height: 0.08
      max_height: 1.5
      min_range: 0.85
      use_global_height: false
      # The compact unorganized cloud is normally close to 10 Hz. A nonzero
      # timeout retains fail-safe STOP behavior if the LiDAR or its TF is lost.
      source_timeout: 1.0
      enabled: true
    depth_points:
      type: "pointcloud"
      topic: /camera/depth_cloud
      min_height: 0.08
      max_height: 1.5
      min_range: 0.30
      use_global_height: false
      source_timeout: 0.5
      enabled: true

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.10
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.2
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
