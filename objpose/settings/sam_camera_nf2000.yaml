%YAML:1.0

# ORB-SLAM3 RGB-D settings for dataset 260826_etri_eightcircle_dark / SAM (objpose rig RT run)
#   source : recording_20260826_164441.db3 (librealsense SDK rosbag2)
#   device : Intel RealSense D455F, SN 253822302376, FW 5.17.3.10
#   NOTE   : intrinsics below are the COLOR stream's, read directly out of the bag
#            (/device_0/sensor_1/Color_0/camera_info). Depth is reprojected into
#            this frame by objpose slam_stream (port of convert_recording.py align()), so these are the correct
#            intrinsics for the aligned pair.

File.version: "1.0"
Camera.type: "PinHole"

Camera1.fx: 386.918
Camera1.fy: 386.347
Camera1.cx: 322.784
Camera1.cy: 250.28

# RealSense reports "Inverse Brown Conrady" for the color stream; coefficients are
# small (|k1| ~ 0.055) and are used here as plumb_bob, matching the convention
# already used by orbslam3_d455f_640x480_rgbd.yaml in this project.
Camera1.k1: -0.056362
Camera1.k2:  0.067728
Camera1.p1:  0.000344
Camera1.p2:  0.000891
Camera1.k3: -0.022403

Camera.width: 640
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

# Depth_Units in the bag = 0.001 m/count -> factor 1000
RGBD.DepthMapFactor: 1000.0

# kept identical to orbslam3_d455f_640x480_rgbd.yaml so timing/accuracy stay
# comparable with this project's earlier runs
Stereo.ThDepth: 40.0
Stereo.b: 0.0745

ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
