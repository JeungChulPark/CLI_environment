# Replacement for the Clearpath lidar3d_0 gz->ROS bridge with 1-deep queues, so a stall can never leave a
# standing backlog (seen: 46 s old scans/points at a steady 20 Hz, bridge RSS 400 MB).
- ros_topic_name: lidar3d_0/scan
  gz_topic_name: /a200_0881/sensors/lidar3d_0/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: lidar3d_0/points
  gz_topic_name: /a200_0881/sensors/lidar3d_0/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  subscriber_queue: 1
  publisher_queue: 1
