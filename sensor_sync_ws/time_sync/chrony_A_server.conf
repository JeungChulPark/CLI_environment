# chrony_A_server.conf — 2대 통합 시 노트북 A(시간 마스터)용
#   배치: sudo cp 이 파일 /etc/chrony/chrony.conf → sudo systemctl restart chronyd
#   (현재 단일머신 검증 단계에선 미사용, 준비만)
local stratum 10                 # 오프라인이면 자체 권위 소스. 인터넷 되면 대신: server <upstream> iburst
allow 192.168.1.0/24             # B 서브넷에 시각 제공
# hwtimestamp *                  # V0(ethtool -T)에서 PHC 확인되면 주석 해제 → 수십 ns
driftfile /var/lib/chrony/chrony.drift
rtcsync
makestep 1.0 3
