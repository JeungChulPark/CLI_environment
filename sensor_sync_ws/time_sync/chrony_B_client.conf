# chrony_B_client.conf — 2대 통합 시 노트북 B(시간 클라이언트)용
#   배치: sudo cp 이 파일 /etc/chrony/chrony.conf → sudo systemctl restart chronyd
#   확인: chronyc tracking / chronyc sources -v / chronyc ntpdata
server 192.168.1.10 iburst minpoll 2 maxpoll 4 xleave   # A를 시각원으로, 짧은 폴+interleaved
# hwtimestamp *                  # B NIC가 PHC 지원 시 주석 해제
driftfile /var/lib/chrony/chrony.drift
rtcsync
makestep 1.0 3
